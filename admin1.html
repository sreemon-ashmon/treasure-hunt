<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Hunt Progress</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f1117; color: #f2f2f2;
    font-family: 'Segoe UI', Arial, sans-serif; padding: 24px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p.sub { color: #9a9aad; margin-top: 0; margin-bottom: 24px; font-size: 0.85rem; }

  table { width: 100%; border-collapse: collapse; max-width: 780px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #262832; font-size: 0.9rem; }
  th { color: #9a9aad; font-weight: 500; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }

  .bar-wrap { background: #1a1c26; border-radius: 6px; overflow: hidden; height: 10px; width: 140px; }
  .bar-fill { background: linear-gradient(90deg, #ffcf5c, #ff9a3c); height: 100%; }

  .winner-row { background: rgba(255, 207, 92, 0.08); }
  .trophy { color: #ffcf5c; }

  #winner-banner {
    display: none;
    margin-bottom: 20px;
    padding: 16px 20px;
    background: linear-gradient(135deg, #ffcf5c, #ff9a3c);
    color: #2a1a00;
    border-radius: 10px;
    font-weight: 600;
    max-width: 780px;
  }
</style>
</head>
<body>

<h1>Treasure Hunt — Live Admin View</h1>
<p class="sub">Not for participant screens. Progress updates automatically.</p>

<div id="winner-banner"></div>

<table>
  <thead>
    <tr>
      <th>Department</th>
      <th>Progress</th>
      <th></th>
      <th>Started</th>
      <th>Finished</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const rowsEl = document.getElementById('rows');
  const banner = document.getElementById('winner-banner');

  function fmt(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleTimeString();
  }

  db.ref('teams').on('value', snap => {
    const teams = snap.val() || {};
    const entries = Object.values(teams);

    // Determine first finisher
    const finishedTeams = entries.filter(t => t.finishedAt).sort((a, b) => a.finishedAt - b.finishedAt);
    const winner = finishedTeams[0];

    if (winner) {
      banner.style.display = 'block';
      banner.textContent = `🏆 ${winner.department} finished first — ${fmt(winner.finishedAt)}`;
    }

    rowsEl.innerHTML = '';
    entries
      .sort((a, b) => (b.currentIndex - a.currentIndex))
      .forEach(t => {
        const total = t.order ? t.order.length : 10;
        const pct = Math.round((t.currentIndex / total) * 100);
        const isWinner = winner && winner.department === t.department;

        const tr = document.createElement('tr');
        if (isWinner) tr.className = 'winner-row';
        tr.innerHTML = `
          <td>${isWinner ? '<span class="trophy">🏆</span> ' : ''}${t.department}</td>
          <td>${t.currentIndex} / ${total}</td>
          <td><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div></td>
          <td>${fmt(t.startedAt)}</td>
          <td>${fmt(t.finishedAt)}</td>
        `;
        rowsEl.appendChild(tr);
      });
  });
</script>

</body>
</html>
