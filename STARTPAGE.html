<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkpoint Puzzle</title>
<style>
  :root {
    --grid-size: 3; /* change to 4 for a harder 4x4 puzzle */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #10121a;
    color: #f2f2f2;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 20px;
  }

  h1 {
    font-size: 1.3rem;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
    text-align: center;
  }

  p.sub {
    color: #9a9aad;
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 0.9rem;
    text-align: center;
  }

  #puzzle {
    display: grid;
    grid-template-columns: repeat(var(--grid-size), 1fr);
    grid-template-rows: repeat(var(--grid-size), 1fr);
    width: min(90vw, 420px);
    height: min(90vw, 420px);
    gap: 2px;
    background: #000;
    border: 3px solid #333;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .tile {
    background-size: calc(var(--grid-size) * 100%) calc(var(--grid-size) * 100%);
    cursor: pointer;
    transition: transform 0.15s ease;
    position: relative;
  }

  .tile:hover {
    filter: brightness(1.1);
  }

  .tile.blank {
    background: #16171f;
    cursor: default;
  }

  #status {
    margin-top: 16px;
    font-size: 0.95rem;
    color: #9a9aad;
  }

  #clue-box {
    display: none;
    margin-top: 24px;
    max-width: min(90vw, 420px);
    background: linear-gradient(135deg, #ffcf5c, #ff9a3c);
    color: #2a1a00;
    padding: 20px 24px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(255, 159, 60, 0.35);
    animation: pop 0.4s ease;
  }

  #clue-box h2 {
    margin: 0 0 8px 0;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  #clue-box p {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.4;
  }

  @keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #reset-btn {
    margin-top: 18px;
    background: transparent;
    border: 1px solid #444;
    color: #ccc;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }

  #reset-btn:hover {
    border-color: #888;
    color: #fff;
  }
</style>
</head>
<body>

  <h1>Solve the Image</h1>
  <p class="sub">Tap tiles next to the blank space to slide them into order</p>

  <div id="puzzle"></div>

  <div id="status">Not solved yet</div>

  <div id="clue-box">
    <h2>Clue Unlocked</h2>
    <p id="clue-text">demo clue here</p>
  </div>

  <button id="reset-btn">Shuffle Again</button>

<script>
  // ==== EDIT THESE TWO LINES ====
  const IMAGE_URL = "https://i.pinimg.com/736x/b7/c7/39/b7c73922f2f3a6989304fe3e0e488398.jpg"; // <-- put your image link here
  const CLUE_TEXT = "demo clue here"; // <-- put the real clue here
  // ================================

  const GRID = parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue('--grid-size'));
  const TILE_COUNT = GRID * GRID;
  const BLANK_INDEX = TILE_COUNT - 1;

  const puzzleEl = document.getElementById('puzzle');
  const statusEl = document.getElementById('status');
  const clueBox = document.getElementById('clue-box');
  const clueText = document.getElementById('clue-text');
  const resetBtn = document.getElementById('reset-btn');

  clueText.textContent = CLUE_TEXT;

  let tiles = []; // tiles[position] = original tile index (BLANK_INDEX = blank)

  function originalPosition(tileIndex) {
    const row = Math.floor(tileIndex / GRID);
    const col = tileIndex % GRID;
    return `${-col * 100}% ${-row * 100}%`;
  }

  function render() {
    puzzleEl.innerHTML = '';
    tiles.forEach((tileIndex, position) => {
      const div = document.createElement('div');
      div.className = 'tile';
      div.dataset.position = position;

      if (tileIndex === BLANK_INDEX) {
        div.classList.add('blank');
      } else {
        div.style.backgroundImage = `url("${IMAGE_URL}")`;
        div.style.backgroundPosition = originalPosition(tileIndex);
      }

      div.addEventListener('click', () => attemptMove(position));
      puzzleEl.appendChild(div);
    });
  }

  function isAdjacent(posA, posB) {
    const rowA = Math.floor(posA / GRID), colA = posA % GRID;
    const rowB = Math.floor(posB / GRID), colB = posB % GRID;
    return (Math.abs(rowA - rowB) + Math.abs(colA - colB)) === 1;
  }

  function attemptMove(position) {
    const blankPos = tiles.indexOf(BLANK_INDEX);
    if (isAdjacent(position, blankPos)) {
      [tiles[position], tiles[blankPos]] = [tiles[blankPos], tiles[position]];
      render();
      checkSolved();
    }
  }

  function checkSolved() {
    const solved = tiles.every((tileIndex, position) => tileIndex === position);
    if (solved) {
      statusEl.textContent = "Solved! 🎉";
      clueBox.style.display = 'block';
    } else {
      statusEl.textContent = "Not solved yet";
      clueBox.style.display = 'none';
    }
  }

  function isSolvable(arr) {
    // count inversions ignoring blank; standard solvability check
    const flat = arr.filter(v => v !== BLANK_INDEX);
    let inversions = 0;
    for (let i = 0; i < flat.length; i++) {
      for (let j = i + 1; j < flat.length; j++) {
        if (flat[i] > flat[j]) inversions++;
      }
    }
    if (GRID % 2 !== 0) {
      return inversions % 2 === 0;
    } else {
      const blankRow = Math.floor(arr.indexOf(BLANK_INDEX) / GRID);
      const blankRowFromBottom = GRID - blankRow;
      return (inversions + blankRowFromBottom) % 2 === 0;
    }
  }

  function shuffle() {
    do {
      tiles = Array.from({ length: TILE_COUNT }, (_, i) => i);
      for (let i = tiles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
      }
    } while (!isSolvable(tiles) || tiles.every((v, i) => v === i));

    render();
    checkSolved();
  }

  resetBtn.addEventListener('click', shuffle);

  shuffle();
</script>

</body>
</html>
