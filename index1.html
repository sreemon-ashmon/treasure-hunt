<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunt — Team Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f1117;
    color: #f2f2f2;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; text-align: center; }
  p.sub { color: #9a9aad; margin-top: 0; margin-bottom: 28px; text-align: center; font-size: 0.9rem; }
  .depts {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    width: min(100%, 360px);
  }
  .dept-btn {
    padding: 18px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1a1c26;
    color: #f2f2f2;
    font-size: 1.05rem;
    cursor: pointer;
    text-align: left;
    transition: 0.15s;
  }
  .dept-btn:hover { border-color: #ffcf5c; background: #22242f; }
  .dept-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #status {
    margin-top: 24px;
    text-align: center;
    font-size: 0.9rem;
    color: #9a9aad;
    max-width: 360px;
  }
  .confirm-box {
    display: none;
    margin-top: 20px;
    background: linear-gradient(135deg, #ffcf5c, #ff9a3c);
    color: #2a1a00;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    max-width: 360px;
  }
  .confirm-box h2 { margin: 0 0 6px 0; font-size: 1.1rem; }
  .confirm-box p { margin: 0; font-size: 0.95rem; }
</style>
</head>
<body>

<h1>Campus Treasure Hunt</h1>
<p class="sub">Select your department team to begin</p>

<div class="depts" id="dept-list">
  <button class="dept-btn" data-dept="Psychology">Psychology</button>
  <button class="dept-btn" data-dept="English">English</button>
  <button class="dept-btn" data-dept="Commerce">Commerce</button>
  <button class="dept-btn" data-dept="Biotechnology">Biotechnology</button>
  <button class="dept-btn" data-dept="Biochemistry">Biochemistry</button>
</div>

<div id="status"></div>

<div class="confirm-box" id="confirm-box">
  <h2>You're in, <span id="confirm-dept"></span>!</h2>
  <p>Head to the <strong>START</strong> QR code and scan it to begin the hunt.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const statusEl = document.getElementById('status');
  const confirmBox = document.getElementById('confirm-box');
  const confirmDept = document.getElementById('confirm-dept');
  const buttons = document.querySelectorAll('.dept-btn');

  // If this device already has a team assigned, skip straight to confirmation
  const existingTeam = localStorage.getItem('qrhunt_team');
  if (existingTeam) {
    document.getElementById('dept-list').style.display = 'none';
    confirmDept.textContent = existingTeam;
    confirmBox.style.display = 'block';
  }

  function generateToken() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const dept = btn.dataset.dept;
      buttons.forEach(b => b.disabled = true);
      statusEl.textContent = 'Setting up your team...';

      const teamRef = db.ref('teams/' + dept);

      teamRef.get().then(snapshot => {
        if (snapshot.exists()) {
          // Team already created by a teammate's phone — just join it
          const data = snapshot.val();
          localStorage.setItem('qrhunt_team', dept);
          localStorage.setItem('qrhunt_secret', data.secretToken);
          statusEl.textContent = '';
          document.getElementById('dept-list').style.display = 'none';
          confirmDept.textContent = dept;
          confirmBox.style.display = 'block';
          return;
        }

        // Claim the first unused order pool via a transaction (race-safe)
        const poolsRef = db.ref('orderPools');
        poolsRef.get().then(poolsSnap => {
          const pools = poolsSnap.val();
          const availableKey = Object.keys(pools).find(k => pools[k].used === false);

          if (!availableKey) {
            statusEl.textContent = 'No available team slots left. Contact an organizer.';
            buttons.forEach(b => b.disabled = false);
            return;
          }

          // Lock the pool first (transaction avoids two teams grabbing the same one)
          db.ref('orderPools/' + availableKey + '/used').transaction(current => {
            if (current === false) return true;
            return; // abort if already taken
          }).then(result => {
            if (!result.committed) {
              statusEl.textContent = 'That slot was just taken — tap your department again.';
              buttons.forEach(b => b.disabled = false);
              return;
            }

            const secretToken = generateToken();
            const order = pools[availableKey].sequence;

            teamRef.set({
              department: dept,
              order: order,
              currentIndex: 0,
              secretToken: secretToken,
              poolUsed: availableKey,
              startedAt: null,
              finishedAt: null
            }).then(() => {
              localStorage.setItem('qrhunt_team', dept);
              localStorage.setItem('qrhunt_secret', secretToken);
              statusEl.textContent = '';
              document.getElementById('dept-list').style.display = 'none';
              confirmDept.textContent = dept;
              confirmBox.style.display = 'block';
            });
          });
        });
      });
    });
  });
</script>

</body>
</html>
