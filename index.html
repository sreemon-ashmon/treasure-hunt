<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Field Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161f1a;
    --ink-2:#1f2b23;
    --paper:#e9e3d0;
    --paper-dim:#cfc7ab;
    --amber:#e8a33d;
    --rust:#b8492f;
    --moss:#5c7a67;
    --moss-line: rgba(233,227,208,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(232,163,61,0.10), transparent 45%),
      var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .frame{
    width:100%;
    max-width:420px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .eyebrow::before{
    content:'';
    width:6px;height:6px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 3px rgba(232,163,61,0.18);
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--paper-dim);
    font-size:14px;
    margin-bottom:22px;
    line-height:1.5;
  }
  .card{
    background:var(--ink-2);
    border:1px solid var(--moss-line);
    border-radius:14px;
    padding:24px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;height:3px;
    background:repeating-linear-gradient(90deg,var(--amber) 0 10px, transparent 10px 20px);
    opacity:.55;
  }
  label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--paper-dim);
    margin-bottom:6px;
  }
  input{
    width:100%;
    background:var(--ink);
    border:1px solid var(--moss-line);
    color:var(--paper);
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:16px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--amber);}
  button{
    width:100%;
    background:var(--amber);
    color:var(--ink);
    border:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:13px 14px;
    border-radius:8px;
    cursor:pointer;
    letter-spacing:.01em;
    transition:transform .1s, filter .15s;
  }
  button:hover{filter:brightness(1.08);}
  button:active{transform:scale(.98);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .error{
    color:var(--rust);
    font-size:13px;
    margin:-8px 0 14px;
    font-family:'IBM Plex Mono',monospace;
    display:none;
  }
  .status-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--paper-dim);
  }
  .bars{display:flex;gap:3px;align-items:flex-end;height:14px;}
  .bars span{width:4px;background:var(--moss-line);border-radius:1px;}
  .bars span.on{background:var(--amber);}
  .bars span:nth-child(1){height:5px;}
  .bars span:nth-child(2){height:8px;}
  .bars span:nth-child(3){height:11px;}
  .bars span:nth-child(4){height:14px;}

  .stamp{
    display:inline-block;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--amber);
    border:2px solid var(--amber);
    padding:4px 10px;
    border-radius:6px;
    transform:rotate(-3deg) scale(0.7);
    opacity:0;
    margin-bottom:16px;
    animation:stampIn .35s cubic-bezier(.2,1.4,.4,1) .1s forwards;
  }
  @keyframes stampIn{
    to{ transform:rotate(-3deg) scale(1); opacity:1; }
  }
  .station-name{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    font-weight:700;
    margin:0 0 14px;
  }
  .clue-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:8px;
  }
  .clue-text{
    background:var(--ink);
    border:1px solid var(--moss-line);
    border-left:3px solid var(--amber);
    border-radius:6px;
    padding:14px 16px;
    font-size:15px;
    line-height:1.55;
    margin-bottom:18px;
    white-space:pre-wrap;
  }
  .site-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:transparent;
    border:1.5px solid var(--amber);
    color:var(--amber);
    text-decoration:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:18px;
  }
  .progress-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--paper-dim);
    text-align:center;
  }
  .progress-line b{color:var(--paper);}
  .hidden{display:none;}
  .center-msg{
    text-align:center;
    padding:20px 4px;
  }
  .center-msg .big{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:700;
    margin-bottom:8px;
  }
  .center-msg .small{
    color:var(--paper-dim);
    font-size:13px;
    line-height:1.6;
  }
  footer{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--moss);
    margin-top:18px;
    letter-spacing:.04em;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="eyebrow">Field Dispatch</div>
  <h1 id="pageTitle">Check In</h1>
  <div class="sub" id="pageSub">Scan a station's code to log your team's progress.</div>

  <div class="card">

    <!-- LOGIN VIEW -->
    <div id="loginView">
      <label for="teamId">Team ID</label>
      <input id="teamId" placeholder="e.g. team1" autocomplete="off">
      <label for="teamToken">Team Passcode</label>
      <input id="teamToken" placeholder="printed on your team card" autocomplete="off">
      <div class="error" id="loginError"></div>
      <button id="loginBtn">Join Hunt</button>
    </div>

    <!-- LOADING VIEW -->
    <div id="loadingView" class="hidden center-msg">
      <div class="big">Reading signal…</div>
      <div class="small">Talking to base.</div>
    </div>

    <!-- RESULT VIEWS (populated by JS) -->
    <div id="resultView" class="hidden"></div>

  </div>
  <footer id="footerStrip"></footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ====================== PASTE YOUR FIREBASE CONFIG BELOW ====================== */
const firebaseConfig = {
  apiKey: "AIzaSyAVDpAofaZ05ji_SPYul7_NzChzXl5lg0c",
  authDomain: "treasure-hunt-fae61.firebaseapp.com",
  projectId: "treasure-hunt-fae61",
  storageBucket: "treasure-hunt-fae61.firebasestorage.app",
  messagingSenderId: "561518091730",
  appId: "1:561518091730:web:b903ef5206fc3ec2e47c0b"
};
/* ================================================================================ */

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(window.location.search);
const stationParam = params.get('station'); // e.g. "st1"

const loginView = document.getElementById('loginView');
const loadingView = document.getElementById('loadingView');
const resultView = document.getElementById('resultView');
const pageTitle = document.getElementById('pageTitle');
const pageSub = document.getElementById('pageSub');
const loginError = document.getElementById('loginError');
const footerStrip = document.getElementById('footerStrip');

function showView(v){
  [loginView, loadingView, resultView].forEach(el => el.classList.add('hidden'));
  v.classList.remove('hidden');
}

function saved(){
  try{
    const raw = localStorage.getItem('fieldDispatchTeam');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function save(teamId, token){
  localStorage.setItem('fieldDispatchTeam', JSON.stringify({teamId, token}));
}

document.getElementById('loginBtn').addEventListener('click', () => {
  const teamId = document.getElementById('teamId').value.trim();
  const token = document.getElementById('teamToken').value.trim();
  loginError.style.display = 'none';
  if(!teamId || !token){
    loginError.textContent = 'Enter both your Team ID and Passcode.';
    loginError.style.display = 'block';
    return;
  }
  showView(loadingView);
  db.ref('teams/' + teamId).once('value').then(snap => {
    const team = snap.val();
    if(!team || team.token !== token){
      showView(loginView);
      loginError.textContent = 'Team ID or passcode not recognized. Check your team card.';
      loginError.style.display = 'block';
      return;
    }
    save(teamId, token);
    proceed(teamId);
  }).catch(() => {
    showView(loginView);
    loginError.textContent = 'Could not reach base. Check your connection and try again.';
    loginError.style.display = 'block';
  });
});

function bars(count /* 0-4 */){
  let html = '<div class="bars">';
  for(let i=1;i<=4;i++){
    html += `<span class="${i <= count ? 'on' : ''}"></span>`;
  }
  html += '</div>';
  return html;
}

function renderMessage(big, small){
  resultView.innerHTML = `<div class="center-msg"><div class="big">${big}</div><div class="small">${small}</div></div>`;
  showView(resultView);
}

function renderStationCard(station, remaining, finished){
  const progressText = finished
    ? '<b>All stations complete.</b> Head back to base.'
    : `<b>${remaining}</b> station${remaining === 1 ? '' : 's'} left to find.`;

  resultView.innerHTML = `
    <div class="stamp">Checked In</div>
    <div class="station-name">${station.department || 'Station'}</div>
    <div class="clue-label">Your clue</div>
    <div class="clue-text">${station.clue || '(no clue set for this station)'}</div>
    ${station.siteUrl ? `<a class="site-link" href="${station.siteUrl}" target="_blank" rel="noopener">Open the site ↗</a>` : ''}
    <div class="progress-line">${progressText}</div>
  `;
  showView(resultView);
}

function proceed(teamId){
  if(!stationParam){
    // No station in URL — just show status, no scan to process.
    pageTitle.textContent = 'Base Camp';
    pageSub.textContent = 'You\u2019re logged in. Scan a station code to check in.';
    db.ref('teams/' + teamId).once('value').then(snap => {
      const team = snap.val();
      footerStrip.textContent = `TEAM ${teamId.toUpperCase()}`;
      if(team && team.finishedAt){
        renderMessage('Hunt complete!', 'Your team has already finished. Nice work.');
      } else {
        const remaining = team ? (team.order.length - team.currentIndex) : null;
        renderMessage('Ready when you are', remaining ? `${remaining} stations left to find.` : 'Find your first station.');
      }
    });
    return;
  }

  pageTitle.textContent = 'Checking In…';
  pageSub.textContent = '';
  showView(loadingView);
  footerStrip.textContent = `TEAM ${teamId.toUpperCase()} · STATION ${stationParam.toUpperCase()}`;

  const teamRef = db.ref('teams/' + teamId);

  teamRef.transaction(team => {
    if(!team) return team; // team missing, abort — handled after
    if(team.finishedAt) return team; // already finished, no-op
    const required = team.order[team.currentIndex];
    if(required !== stationParam) return team; // wrong station, no-op — checked after

    // Correct station: advance.
    const now = Date.now();
    const updated = Object.assign({}, team);
    if(!updated.startedAt) updated.startedAt = now;
    updated.currentIndex = team.currentIndex + 1;
    if(updated.currentIndex >= team.order.length){
      updated.finishedAt = now;
    }
    updated.__lastStation = stationParam; // used below to know we just advanced
    return updated;
  }, (error, committed, snap) => {
    if(error){
      renderMessage('Signal lost', 'Something went wrong talking to base. Try scanning again.');
      return;
    }
    const team = snap.val();
    if(!team){
      renderMessage('Team not found', 'Please log in again from the base camp link.');
      return;
    }
    if(team.finishedAt && team.__lastStation !== stationParam){
      renderMessage('Hunt complete!', 'Your team has already finished. Nice work.');
      return;
    }
    if(team.__lastStation === stationParam){
      // We just advanced because of this scan — show the clue for THIS station.
      db.ref('stations/' + stationParam).once('value').then(sSnap => {
        const station = sSnap.val() || {};
        const remaining = team.order.length - team.currentIndex;
        renderStationCard(station, remaining, !!team.finishedAt);
      });
      return;
    }
    // Scan didn't match — figure out why.
    const requiredIndex = team.currentIndex;
    const requiredStation = team.order[requiredIndex];
    if(team.order.indexOf(stationParam) < requiredIndex){
      renderMessage('Already checked in', 'Your team already logged this station. Find your next one.');
    } else {
      renderMessage('Not your station yet', 'This isn\u2019t next on your route. Check your current clue and try the right spot.');
    }
  });
}

const existing = saved();
if(existing){
  showView(loadingView);
  proceed(existing.teamId);
} else {
  showView(loginView);
}
</script>
</body>
</html>
